name: Gerar APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci


      - name: Adicionar gestos na tela de revisao
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")
          marker = "init().catch(e=>{$('#load').innerHTML='<div><b>Erro ao carregar</b><br><small>'+String(e&&e.message||e)+'</small></div>'});\n})();"
          gesture = r"""
          // Gestos na revisao: esquerda = De novo; direita = Bom.
          (() => {
            const area = document.getElementById('rvBody');
            if (!area) throw new Error('Area de revisao #rvBody nao encontrada');
            let start = null;
            area.addEventListener('pointerdown', e => {
              if (e.button !== 0 || e.target.closest('button,a,input,textarea,select')) { start = null; return; }
              if (!RV.cur || !RV.shown || document.getElementById('rv').hidden) { start = null; return; }
              start = { x: e.clientX, y: e.clientY, id: e.pointerId, card: RV.cur, at: Date.now() };
            }, { passive: true });
            area.addEventListener('pointerup', e => {
              if (!start || e.pointerId !== start.id) return;
              const dx = e.clientX - start.x, dy = e.clientY - start.y;
              const valid = Math.abs(dx) >= 70 && Math.abs(dx) > Math.abs(dy) * 1.4 && Date.now() - start.at < 1500;
              const card = start.card;
              start = null;
              if (!valid || !RV.shown || RV.cur !== card || document.getElementById('rv').hidden) return;
              rvAnswer(dx > 0);
            }, { passive: true });
            area.addEventListener('pointercancel', () => { start = null; }, { passive: true });
          })();
          """
          if marker not in s:
              raise SystemExit("Nao encontrei o ponto seguro para inserir os gestos")
          s = s.replace(marker, marker[:-len("\n})();")] + "\n" + gesture + "\n})();", 1)
          p.write_text(s, encoding="utf-8")
          print("Gestos inseridos em www/index.html")
          PY

      - name: Criar projeto Android
        run: npx cap add android

      - name: Aplicar ajustes do app (tela cheia, AnkiDroid, versao, assinatura fixa)
        run: |
          test -f overlay/debug.keystore || { echo "::error::Falta o arquivo overlay/debug.keystore no GitHub. Sem ele o app nao atualiza por cima."; exit 1; }
          cp overlay/debug.keystore android/app/fixo.keystore
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF2'

          android {
              signingConfigs {
                  fixo {
                      storeFile file('fixo.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fixo }
                  release { signingConfig signingConfigs.fixo }
              }
              defaultConfig {
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
              }
              packagingOptions {
                  jniLibs { useLegacyPackaging true }
              }
          }
          dependencies {
              implementation 'org.videolan.android:libvlc-all:3.5.1'
          }
          EOF2
          cp overlay/MainActivity.java android/app/src/main/java/com/tem/minerador/MainActivity.java
          cp overlay/AnkiPlugin.java android/app/src/main/java/com/tem/minerador/AnkiPlugin.java
          cp overlay/VlcPlugin.java android/app/src/main/java/com/tem/minerador/VlcPlugin.java
          if [ -d overlay/res ]; then cp -r overlay/res/. android/app/src/main/res/; fi
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<!-- Permissions -->#<uses-permission android:name="com.ichi2.anki.permission.READ_WRITE_DATABASE" />\n    <queries><package android:name="com.ichi2.anki" /></queries>#' android/app/src/main/AndroidManifest.xml
          grep -q "com.ichi2.anki.permission.READ_WRITE_DATABASE" android/app/src/main/AndroidManifest.xml

      - name: Copiar o app para o projeto
        run: npx cap sync android

      - name: Usar sempre a mesma assinatura (atualiza sem desinstalar)
        run: |
          mkdir -p ~/.android
          cp overlay/debug.keystore ~/.android/debug.keystore

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Conferir a assinatura (tem que ser sempre a mesma)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee cert.txt
          grep -qi "SHA-256 digest: 1ea6d3cb52a16ffb4b83b422d54a350db51fe05f501c1283c9b935f949010947" cert.txt || { echo "::error::A assinatura do APK nao e a fixa. Confira se o overlay/debug.keystore e o mesmo que foi enviado."; exit 1; }
          echo "Versao 1.${{ github.run_number }} assinada com a chave fixa."

      - uses: actions/upload-artifact@v4
        with:
          name: Minerador-APK-v1.${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
